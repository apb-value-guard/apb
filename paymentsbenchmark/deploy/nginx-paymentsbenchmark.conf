# paymentsbenchmark.com: static site, served by the host Nginx.
# Installed once to /etc/nginx/sites-available/paymentsbenchmark.com.
# After the first install, certbot adds the 443 listener and certificate lines
# to the copy on the server, so deploy.ps1 never overwrites it.
#
# Only these two hostnames match this block, so it cannot take traffic from
# st4bl.com, remitprotocol.com or the IP-based portfolio dashboard.

server {
    listen 80;
    listen [::]:80;
    server_name paymentsbenchmark.com www.paymentsbenchmark.com;

    # www -> apex, keeping the path (pages declare the apex as canonical).
    # Let's Encrypt's HTTP-01 check for www is answered here, not redirected,
    # so certificate issuance and renewal work for both names.
    set $www_redirect 0;
    if ($host = www.paymentsbenchmark.com) { set $www_redirect 1; }
    if ($uri ~ "^/\.well-known/acme-challenge/") { set $www_redirect 0; }
    if ($www_redirect) {
        return 301 https://paymentsbenchmark.com$request_uri;
    }

    # "current" is a symlink to the active release, so a deploy swaps atomically
    # and a rollback is one symlink change.
    root /var/www/paymentsbenchmark/current;
    index index.html;

    access_log /var/log/nginx/paymentsbenchmark.access.log;
    error_log  /var/log/nginx/paymentsbenchmark.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    charset utf-8;
    charset_types text/plain text/markdown text/css application/javascript application/json image/svg+xml;

    # Clean URLs: /method serves method.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # method.md / results.md as Markdown. (A server-level "types" block would
    # replace the whole MIME map, so set it here only.)
    location ~* \.md$ {
        default_type text/markdown;
        types { }
        try_files $uri =404;
    }

    error_page 404 /404.html;

    # CSS/JS file names aren't hashed, so keep their cache short.
    location ~* \.(?:css|js)$ {
        expires 1h;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.(?:woff2|svg|png|ico)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
