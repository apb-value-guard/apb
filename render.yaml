# Public demo on Render: synthetic quotes, template explanations, no payments.
services:
  - type: web
    name: apb-value-guard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn apb.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.15"
      - key: AI_BACKEND
        value: none
      - key: ALLOW_EXECUTE
        value: "false"
      # Shows the public banner and keeps execution off even if ALLOW_EXECUTE
      # changes. Never add PayPal or Anthropic keys to this service.
      - key: PUBLIC_DEMO
        value: "true"
